<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fruit Quality AI - Home</title>
    <style>
        body { 
            margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #1d976c 0%, #93f9b9 100%); 
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        .navbar { position: absolute; top: 20px; right: 30px; }
        .inspect-btn { 
            background: white; color: #1d976c; padding: 12px 25px; 
            border-radius: 30px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .hero { text-align: center; background: rgba(0,0,0,0.1); padding: 50px; border-radius: 20px; backdrop-filter: blur(5px); }
        h1 { font-size: 3rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/inspect" class="inspect-btn">INSPECT NOW</a>
    </div>
    <div class="hero">
        <h1>Fruit Quality AI</h1>
        <p>Advanced Deep Learning for Freshness Detection</p>
    </div>
</body>
</html>
